<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">The Macro Lens — a curiosity for economics</title><desc id="desc">Decorative animation of a globe, trade routes, and economic cycles. Illustrative, not live market data.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091a2c"/><stop offset=".5" stop-color="#15132e"/><stop offset="1" stop-color="#102e31"/></linearGradient><linearGradient id="line"><stop stop-color="#2dd4bf"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/></linearGradient><radialGradient id="earth"><stop stop-color="#164e63"/><stop offset="1" stop-color="#0a172c"/></radialGradient><clipPath id="sphere"><circle cx="190" cy="185" r="108"/></clipPath></defs>
<style>
.route{stroke-dasharray:8 12;animation:flow 5s linear infinite}.route2{animation-duration:7s;animation-direction:reverse}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}.scan{animation:scan 8s ease-in-out infinite alternate}.cycle{stroke-dasharray:800;stroke-dashoffset:800;animation:draw 9s ease-in-out infinite}.meridian{animation:rotate 16s linear infinite;transform-origin:190px 185px}.spark{animation:glow 3s ease-in-out infinite alternate}
@keyframes flow{to{stroke-dashoffset:-100}}@keyframes pulse{50%{opacity:.3;transform:scale(1.15)}}@keyframes scan{from{transform:translateX(0)}to{transform:translateX(490px)}}@keyframes draw{0%{stroke-dashoffset:800}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-800}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes glow{to{opacity:.25}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.cycle{stroke-dashoffset:0}}
</style>
<rect x="1" y="1" width="998" height="358" rx="22" fill="url(#bg)" stroke="#2dd4bf" stroke-opacity=".3"/>
<g font-family="Verdana,sans-serif"><text x="30" y="37" font-size="11" letter-spacing="4" fill="#5eead4">BEYOND THE CODE</text><text x="380" y="87" font-size="32" font-weight="bold" fill="#f8fafc">The Macro Lens</text><text x="380" y="117" font-size="13" fill="#cbd5e1">Curious about the systems that move the world.</text></g>
<circle cx="190" cy="185" r="128" fill="none" stroke="#2dd4bf" stroke-opacity=".15" stroke-dasharray="2 9"/>
<circle cx="190" cy="185" r="108" fill="url(#earth)" stroke="#22d3ee" stroke-opacity=".7"/>
<g clip-path="url(#sphere)" fill="none" stroke="#22d3ee" stroke-opacity=".3"><ellipse cx="190" cy="185" rx="108" ry="35"/><ellipse cx="190" cy="185" rx="108" ry="75"/><ellipse cx="190" cy="185" rx="38" ry="108"/><ellipse cx="190" cy="185" rx="78" ry="108"/><path d="M82 185H298M190 77V293"/><g class="meridian"><ellipse cx="190" cy="185" rx="108" ry="24" stroke="#5eead4" stroke-opacity=".5"/></g></g>
<g fill="none" stroke-width="2"><path d="M104 171Q178 65 270 153" stroke="#fbbf24" opacity=".3"/><path class="route" d="M104 171Q178 65 270 153" stroke="#fbbf24"/><path class="route route2" d="M125 235Q211 109 275 202" stroke="#c084fc"/><path class="route" d="M102 181Q156 263 260 218" stroke="#2dd4bf"/></g>
<g fill="#fbbf24"><circle cx="104" cy="171" r="4"/><circle cx="270" cy="153" r="4"/><circle class="pulse" cx="104" cy="171" r="9" fill="none" stroke="#fbbf24"/></g><g fill="#c084fc"><circle cx="125" cy="235" r="4"/><circle cx="275" cy="202" r="4"/></g>
<g stroke="#94a3b8" stroke-opacity=".12"><path d="M380 157H940"/><path d="M380 187H940"/><path d="M380 217H940"/><path d="M380 247H940"/><path d="M380 148V253"/><path d="M450 148V253"/><path d="M520 148V253"/><path d="M590 148V253"/><path d="M660 148V253"/><path d="M730 148V253"/><path d="M800 148V253"/><path d="M870 148V253"/><path d="M940 148V253"/></g><rect class="scan" x="380" y="148" width="2" height="105" fill="#5eead4" opacity=".35"/>
<path d="M380 210Q415 145 450 198T520 205T590 186T660 191T730 172T800 184T870 161T940 174" stroke="#a78bfa" stroke-opacity=".2" stroke-width="2" fill="none"/>
<path class="cycle" d="M380 210Q415 145 450 198T520 205T590 186T660 191T730 172T800 184T870 161T940 174" stroke="url(#line)" stroke-width="3" fill="none"/>
<path class="route route2" d="M380 231Q460 178 540 219T700 206T860 192T940 202" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity=".7"/>
<g font-family="Verdana,sans-serif" font-size="11" text-anchor="middle"><rect x="380" y="274" width="130" height="29" rx="7" fill="#2dd4bf" fill-opacity=".09" stroke="#2dd4bf" stroke-opacity=".35"/><text x="445.0" y="293" fill="#2dd4bf" font-size="9">GLOBAL TRADE</text><rect x="522" y="274" width="128" height="29" rx="7" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa" stroke-opacity=".35"/><text x="586.0" y="293" fill="#a78bfa" font-size="9">MONEY &amp; POLICY</text><rect x="662" y="274" width="130" height="29" rx="7" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24" stroke-opacity=".35"/><text x="727.0" y="293" fill="#fbbf24" font-size="9">ECONOMIC CYCLES</text><rect x="804" y="274" width="137" height="29" rx="7" fill="#38bdf8" fill-opacity=".09" stroke="#38bdf8" stroke-opacity=".35"/><text x="872.5" y="293" fill="#38bdf8" font-size="9">BIG PICTURE</text></g><g font-family="Verdana,sans-serif"><text x="82" y="327" font-size="10" letter-spacing="2" fill="#5eead4">THINK IN SYSTEMS.</text><text x="380" y="333" font-size="10" fill="#64748b">A personal interest in economics · illustrative animation</text></g><circle class="spark" cx="953" cy="36" r="4" fill="#2dd4bf"/></svg>